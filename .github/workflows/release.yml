# Builds the Windows installer when a version tag (v0.1.0, v0.1.0-beta.1) is pushed and
# attaches it to a GitHub release. Tags with "-" become pre-releases.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build exe
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -like 'v*') { $tag.Substring(1) } else { "0.0.0-dev" }
          go build -trimpath -ldflags "-s -w -X main.version=$ver" -o dist/tallyguru.exe ./cmd/tallyguru
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/tallyguru-agent.exe ./cmd/tallyguru-agent

      - name: Install Inno Setup 7.1.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-7_1_1 -R jrsoftware/issrc -p innosetup-7.1.1-x64.exe -O is.exe
          Start-Process is.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER','/DIR=C:\inno' -Wait

      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -like 'v*') { $tag.Substring(1) } else { "0.0.0-dev" }
          & C:\inno\ISCC.exe "/DAppVersion=$ver" packaging\tallyguru.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist\TallyMCP-Setup-$ver.exe" dist\TallyMCP-Setup.exe
          Get-FileHash dist\TallyMCP-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: tallyguru-${{ env.VER }}
          path: |
            dist/TallyMCP-Setup.exe
            dist/tallyguru.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ github.ref_name }}" -like '*-*') { $extra += '--prerelease' }
          # Only the installer is published (author, 21 Nov 2026): one file to download.
          gh release create "${{ github.ref_name }}" dist/TallyMCP-Setup.exe dist/SHA256SUMS.txt `
            --title "LedgerGuru ${{ env.VER }}" --generate-notes @extra
